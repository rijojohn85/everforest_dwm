# keyd configuration -- Miryoku-style home row mods + a capslock nav layer.
#
# capslock : hold = Control, tap = Escape
#
# Home row mods (hold = modifier, tap = the letter; 200ms decision window):
#   a / ;  -> Meta (Super)
#   s / l  -> Alt
#   d / k  -> Control
#   f / j  -> Shift
#
# Capslock (Control) navigation layer:
#   Control + h/j/k/l         -> arrows
#   Control + Shift + h/j/k/l -> word-wise arrows (Ctrl+arrow)
#
# [ids] * applies to all attached keyboards.

[ids]
*

[main]
capslock = overload(control, esc)
a = overloadt(meta, a, 200)
s = overloadt(alt, s, 200)
d = overloadt(control, d, 200)
f = overloadt(shift, f, 200)
j = overloadt(shift, j, 200)
k = overloadt(control, k, 200)
l = overloadt(alt, l, 200)
semicolon = overloadt(meta, semicolon, 200)

[control:C]
h = left
j = down
k = up
l = right

# Activates when both capslock and shift is pressed
[control+shift]
h = C-left
j = C-down
k = C-up
l = C-right
